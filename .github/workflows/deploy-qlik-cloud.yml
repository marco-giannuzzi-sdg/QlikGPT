name: QlikGPT — Governed Qlik Cloud deployments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'catalog/**'
      - 'apps/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/deploy-qlik-cloud.yml'

# Explicit opt-in: initially off. Enable only after storing secrets.
concurrency:
  group: qlikgpt-dev-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qlik-deploy:
    name: ETL and governed Presentation deployment
    # To prevent accidental runs before credentials are configured.
    if: ${{ vars.QLIK_CICD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QLIK_TENANT: https://sdggroup-it.eu.qlikcloud.com
      QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
      QLIK_SPACE_ID: ${{ vars.QLIK_SPACE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Install Qlik CLI 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/qlik-oss/qlik-cli/releases/download/v3.4.0/qlik-Linux-x86_64.tar.gz" \
            --output /tmp/qlik-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/qlik-cli.tar.gz -C "$HOME/.local/bin" qlik
          chmod +x "$HOME/.local/bin/qlik"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/qlik" version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WebSocket client for Qlik Engine API
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir websocket-client==1.8.0

      - name: Generate Semantic Catalog 2.0 usage and impact matrix
        shell: bash
        run: python3 ci/catalog_report.py

      - name: Unit-test and compile the Semantic Catalog
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile ci/semantic_catalog.py ci/semantic_assets.py ci/catalog_report.py ci/deploy.py ci/deploy_visuals.py

      - name: Authenticate to Qlik Cloud
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QLIK_API_KEY" || { echo "Missing QLIK_API_KEY GitHub Secret"; exit 1; }
          qlik context create qlikgpt-ci --server "$QLIK_TENANT" --api-key "$QLIK_API_KEY"
          qlik context use qlikgpt-ci
          qlik user me >/dev/null
          echo "Qlik Cloud authentication confirmed."

      - name: Choose full or frontend-only deployment
        shell: bash
        run: |
          set -euo pipefail
          scope=full
          if [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Eq '^scripts/'; then
              scope=frontend
            fi
          fi
          echo "QLIK_DEPLOY_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "Deployment scope: $scope"

      - name: Create or reuse apps, deploy QVS and frontend JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/deploy.py

      - name: Persist app IDs and Semantic Catalog report to GitHub
        # Persist even if ETL2 / Presentation reload fails, avoiding duplicates on retry.
        if: ${{ always() && vars.QLIK_CICD_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- deployment/app-ids.json catalog/USAGE.md catalog/usage.json
          if git diff --cached --quiet; then
            echo "App IDs and Semantic Catalog report unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(qlik): refresh semantic usage report and app IDs [skip ci]"
          git push origin HEAD:main
