name: QlikGPT — Governed Qlik Cloud deployments

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operazione: distribuisci script senza reload, reload singolo o catena"
        type: choice
        required: true
        default: deploy-only
        options:
          - deploy-only
          - reload-app
          - reload-chain
      target_app:
        description: "Chiave app QlikGPT (etl1, etl2, presentation, presentation2)"
        type: string
        required: true
        default: etl2
  push:
    branches: [main]
    paths:
      - 'semantic-models/**'
      - 'tests/**'
      - 'ci/**'
      - 'ui/**'
      - '.github/workflows/deploy-qlik-cloud.yml'

# Explicit opt-in: initially off. Enable only after storing secrets.
concurrency:
  group: qlikgpt-dev-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  qlik-deploy:
    name: Script deploy and explicit reload control
    # To prevent accidental runs before credentials are configured.
    if: ${{ vars.QLIK_CICD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QLIK_TENANT: https://sdggroup-it.eu.qlikcloud.com
      QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
      QLIK_SPACE_ID: ${{ vars.QLIK_SPACE_ID }}
      QLIK_MODEL_ID: sales
      QLIK_DEPLOY_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy-only' }}
      QLIK_DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target_app || '' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Install Qlik CLI 3.4.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/qlik-oss/qlik-cli/releases/download/v3.4.0/qlik-Linux-x86_64.tar.gz" \
            --output /tmp/qlik-cli.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/qlik-cli.tar.gz -C "$HOME/.local/bin" qlik
          chmod +x "$HOME/.local/bin/qlik"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/qlik" version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install WebSocket client for Qlik Engine API
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir websocket-client==1.8.0

      - name: Generate Semantic Catalog 2.0 usage and impact matrix
        shell: bash
        run: python3 ci/catalog_report.py

      - name: Generate App Lineage and downstream impact maps
        shell: bash
        run: python3 ci/app_lineage.py

      - name: Generate evidence-based end-to-end field lineage
        shell: bash
        run: python3 ci/field_lineage.py

      - name: Unit-test and compile the Semantic Catalog
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile ci/semantic_catalog.py ci/semantic_assets.py ci/catalog_report.py ci/app_lineage.py ci/field_lineage.py ci/model_registry.py ci/deployment_plan.py ci/reload_chain.py ci/deploy.py ci/deploy_visuals.py ci/deploy_theme.py ci/ui_template.py

      - name: Validate reusable native Qlik frontend template
        shell: bash
        run: python3 ci/ui_template.py --check

      - name: Authenticate to Qlik Cloud
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QLIK_API_KEY" || { echo "Missing QLIK_API_KEY GitHub Secret"; exit 1; }
          qlik context create qlikgpt-ci --server "$QLIK_TENANT" --api-key "$QLIK_API_KEY"
          qlik context use qlikgpt-ci
          qlik user me >/dev/null
          echo "Qlik Cloud authentication confirmed."

      - name: Enforce explicit script deployment / data-reload separation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$QLIK_DEPLOY_OPERATION" = "deploy-only"
            test -z "$QLIK_DEPLOY_TARGET"
            echo "Push: deploy changed scripts with --no-reload; NEVER reload data."
          else
            test -n "$QLIK_DEPLOY_TARGET"
            echo "Manual operation: $QLIK_DEPLOY_OPERATION; target: $QLIK_DEPLOY_TARGET"
          fi

      - name: Deploy scripts without reload, then run ONLY explicitly requested reloads
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/deploy.py

      - name: Publish QlikGPT Executive Premium theme and assign to Sales Overview
        shell: bash
        run: |
          set -euo pipefail
          # Qlik CLI uses the existing qlikgpt-ci context and QLIK_API_KEY secret.
          # The script is idempotent, patches only our own QEXT and checks QIX readback.
          # This does NOT trigger a Qlik data reload.
          python3 ci/deploy_theme.py --apply-app presentation

      - name: Persist generated lineage, semantic reports and app IDs
        # Persist reports and IDs even when an explicitly requested reload fails.
        if: ${{ always() && vars.QLIK_CICD_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- semantic-models/sales/deployment/app-ids.json
          if [ -f semantic-models/sales/catalog/USAGE.md ] && [ -f semantic-models/sales/catalog/usage.json ]; then
            git add -- semantic-models/sales/catalog/USAGE.md semantic-models/sales/catalog/usage.json
          fi
          if [ -f semantic-models/sales/lineage/APP_LINEAGE.md ] && [ -f semantic-models/sales/lineage/graph.json ]; then
            git add -- semantic-models/sales/lineage/APP_LINEAGE.md semantic-models/sales/lineage/graph.json
          fi
          if [ -f semantic-models/sales/lineage/END_TO_END.md ] && [ -f semantic-models/sales/lineage/end_to_end.json ]; then
            git add -- semantic-models/sales/lineage/END_TO_END.md semantic-models/sales/lineage/end_to_end.json
          fi
          if git diff --cached --quiet; then
            echo "App IDs, Semantic Catalog and App Lineage reports unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(qlik): refresh semantic usage and app lineage reports [skip ci]"
          git push origin HEAD:main
